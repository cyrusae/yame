[package]
name = "yame"
version = "0.1.0"
edition = "2024"
description = "A lightweight terminal Markdown editor"
license = "MIT"
authors = ["Cyrus <cyrus.eosphoros@gmail.com>"]
repository = "https://github.com/cyrusae/yame"
homepage = "https://github.com/cyrusae/yame"
readme = "README.md"
keywords = ["markdown", "editor", "terminal", "tui"]
categories = ["command-line-utilities", "text-editors"]
exclude = [".chainlink", ".claude", ".github", "_docs", ".antigravitycli", ".mcp.json", "mutants.out"]

[dependencies]
ratatui = "0.30"
tui-textarea = { version = "0.7", features = ["crossterm"] }
crossterm = "0.28"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
toml = "1.1"
arboard = "3"
unicode-width = "0.2"
syntect = { version = "5.3.0", default-features = false, features = ["default-themes", "default-syntaxes", "regex-fancy"] }
# Extra syntax definitions (TOML, TypeScript, Kotlin, Dockerfile, …) curated by
# the bat project.  `syntect-fancy` matches our `regex-fancy` pure-Rust setup.
two-face = { version = "0.5.1", default-features = false, features = ["syntect-fancy"] }
# Already pulled in transitively by syntect's regex-fancy feature — zero extra cost.
fancy-regex = { version = "0.16", default-features = false }

[features]
# Activate during mutation testing: `cargo mutants --features mutants-skip`
# Excluded from normal builds — the proc macro adds zero runtime cost but
# is still removed from the default dependency graph to avoid confusing contributors.
mutants-skip = ["dep:mutants"]

[dependencies.mutants]
# Provides the #[cfg_attr(feature = "mutants-skip", mutants::skip)] attribute.
# Optional: only compiled when --features mutants-skip is passed (i.e. during
# mutation testing runs). Not present in normal cargo build / cargo test output.
version = "0.0.4"
optional = true

[profile.release]
strip = true
opt-level = 3
